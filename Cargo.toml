[package]
name = "androiduse-zygisk-loader"
version = "0.1.0"
edition = "2021"
authors = ["LIghtJUNction"]
description = "AndroidUse Zygisk dynamic hook loader infrastructure"
license = "MIT"

[dependencies]
bitflags = "1.3.2"
jni = "0.21.0"
log = "0.4.14"
libc = "0.2"

[lib]
name = "androiduse_zygisk_loader"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace]
